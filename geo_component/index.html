<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; font-family: sans-serif; }
  button {
    width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #4a4a4a;
    background: #262730; color: #fafafa; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #333644; }
  #status { color: #ff6b6b; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<button id="locate-btn">Use my current location</button>
<div id="status"></div>
<script>
  // Same hand-rolled Streamlit component wire protocol used by the Google
  // Maps component (index.html elsewhere in this project) - a plain
  // postMessage handshake, no npm/React build needed.
  function sendToStreamlit(type, payload) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, payload), "*");
  }
  function setComponentValue(value) {
    sendToStreamlit("streamlit:setComponentValue", { value: value });
  }
  function setFrameHeight(height) {
    sendToStreamlit("streamlit:setFrameHeight", { height: height });
  }

  const statusEl = document.getElementById("status");

  document.getElementById("locate-btn").addEventListener("click", () => {
    statusEl.textContent = "";
    if (!navigator.geolocation) {
      statusEl.textContent = "Geolocation is not supported by this browser.";
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (position) => {
        setComponentValue({
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
        });
      },
      (error) => {
        // error.code: 1 = permission denied, 2 = position unavailable, 3 = timeout
        statusEl.textContent = "Couldn't get location: " + error.message;
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  // No render-time args needed for this component - just announce ready.
  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  setFrameHeight(70);
</script>
</body>
</html>
